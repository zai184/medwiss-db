[project]
name = "medwiss-db"
version = "1.8.1"
description = "Index and browser for local medical folders. PostgreSQL stores the file index and guideline passages."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    # Pipeline dependencies
    "watchdog>=4.0.2",
    "pytesseract>=0.3.13",
    "Pillow>=10.4.0",
    "pdf2image>=1.17.0",
    # File upload
    "python-multipart>=0.0.12",
    # Email validation
    "email-validator>=2.0.0",
    # Vector similarity search
    "pgvector>=0.2.0",
    # HTTP client
    "httpx>=0.27.0",
    # Configuration
    "pyyaml>=6.0",
    # CLI output formatting
    "rich>=13.0.0",
    "pymupdf>=1.24.14",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.3",
    "httpx>=0.27.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "pipeline*", "search*", "database*", "scripts*"]
exclude = ["ui*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py311"
